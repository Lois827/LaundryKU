<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaundryKu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>LaundryKu</h1><p>Manajemen Pesanan Laundry</p></header>
<main>
<section class="stats">
<div><span>Total</span><b id="total">0</b></div>
<div><span>Diproses</span><b id="proses">0</b></div>
<div><span>Selesai</span><b id="selesai">0</b></div>
<div><span>Sudah Diambil</span><b id="diambil">0</b></div>
</section>

<section class="card">
<h2>Tambah Pesanan</h2>
<form id="form">
<div class="grid">
<label>Nama Pelanggan<input id="nama" required></label>
<label>No. WhatsApp<input id="wa" type="tel" required></label>
<label>Jenis Laundry<select id="jenis"><option>Cuci Kering</option><option>Cuci + Setrika</option><option>Setrika</option><option>Express</option><option>Lainnya</option></select></label>
<label>Berat (kg)<input id="berat" type="number" min=".1" step=".1" required></label>
<label>Total Harga<input id="harga" type="number" min="0" required></label>
<label>Estimasi Selesai<input id="estimasi" type="datetime-local" required></label>
<label class="full">Catatan<textarea id="catatan" rows="3" placeholder="Contoh: pakaian putih, selimut, dll."></textarea></label>
</div>
<button>Simpan Pesanan</button>
</form>
</section>

<section class="card">
<div class="head"><div><h2>Daftar Pesanan</h2><small id="jumlah">0 pesanan</small></div><input id="cari" placeholder="Cari pelanggan..."></div>
<div class="tabs">
<button class="tab active" data-filter="Semua">Semua</button>
<button class="tab" data-filter="Diproses">Diproses</button>
<button class="tab" data-filter="Selesai">Selesai</button>
<button class="tab" data-filter="Sudah Diambil">Sudah Diambil</button>
</div>
<div id="list"></div>
<div id="kosong" class="empty"><b>Belum ada pesanan</b><p>Tambahkan pesanan laundry pertama.</p></div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
